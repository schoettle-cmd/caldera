# Releases are built here, not on a laptop: pushing a version tag (e.g. 0.25.9) builds the plugin from this commit,
# runs the tests, signs build provenance for main.js, manifest.json and styles.css, and publishes the GitHub release with
# all three attached in one step (immutable releases allow no later uploads). Anyone can check a download with
#   gh attestation verify main.js -R schoettle-cmd/caldera
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches manifest
        run: |
          test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
          test "$(jq -r .version packages/plugin/manifest.json)" = "$GITHUB_REF_NAME"
      - name: Collect release files
        run: |
          mkdir out
          cp packages/plugin/main.js packages/plugin/styles.css out/
          cp manifest.json out/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/main.js
            out/manifest.json
            out/styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/main.js out/manifest.json out/styles.css --title "$GITHUB_REF_NAME" --notes-file <(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
